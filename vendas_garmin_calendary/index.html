<!DOCTYPE html>
<html lang="pt-BR" style="visibility:hidden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Estoque Calendário</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="login-main">
  <div class="login-card">
    <div class="logo-slot login-logo-slot" title="Espaço reservado para logomarca">
      <span class="logo-placeholder-text">SUA LOGO</span>
    </div>
    <h1 class="login-title">Estoque<span class="brand-title-accent">Calendário</span></h1>
    <p class="login-subtitle">Entre com sua conta autorizada para continuar.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="fieldEmail">E-mail</label>
        <input type="email" id="fieldEmail" placeholder="voce@empresa.com" autocomplete="username" required>
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="fieldPassword">Senha</label>
        <input type="password" id="fieldPassword" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <label class="login-remember">
        <input type="checkbox" id="fieldRemember">
        <span>Lembrar de mim</span>
      </label>

      <p class="login-error" id="loginError" hidden></p>

      <div class="form-actions login-actions">
        <button type="submit" class="btn btn-primary login-submit" id="loginSubmitBtn">Entrar</button>
      </div>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="login.js"></script>
</body>
</html>
