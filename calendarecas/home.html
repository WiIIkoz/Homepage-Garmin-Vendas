<!DOCTYPE html>
<html lang="pt-BR" style="visibility:hidden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Calendário</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-left">
    <a class="brand-link" href="home.html">
      <div class="logo-slot" title="Espaço reservado para logomarca">
        <span class="logo-placeholder-text">SUA LOGO</span>
      </div>
      <span class="brand-title">Estoque<span class="brand-title-accent">Calendário</span></span>
    </a>
  </div>
  <div class="header-right">
    <span class="home-greeting" id="homeGreeting">Bom dia, William.</span>
    <button class="btn btn-outline" id="headerConfigBtn" type="button">Configurações</button>
    <div class="profile-menu">
      <button class="profile-icon-btn" id="profileMenuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu do usuário">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
      </button>
      <div class="profile-popover" id="profilePopover">
        <button class="profile-popover-item" id="profileConfigBtn" type="button">Configurações</button>
        <button class="profile-popover-item profile-popover-danger" id="profileLogoutBtn" type="button">Sair</button>
      </div>
    </div>
  </div>
</header>

<!-- SUBHEADER / DRAWER TOGGLE -->
<div class="subheader">
  <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Abrir menu" aria-expanded="false">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <span>Menu</span>
    <button class="drawer-close" id="drawerClose" aria-label="Fechar menu">&times;</button>
  </div>
  <div class="drawer-body">
    <a class="drawer-link" href="https://nf-ewill.netlify.app/app.html" target="_blank" rel="noopener noreferrer">
      <svg class="drawer-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4"/><path d="M9 13h6"/><path d="M9 17h6"/><path d="M9 9h2"/></svg>
      <span>Notas Fiscais</span>
    </a>
  </div>
</aside>

<!-- MAIN -->
<main class="home-main">
  <div class="home-grid">
    <button class="home-tile" id="tileProdutos" type="button">
      <span class="home-tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      </span>
      <span class="home-tile-label">Produtos</span>
    </button>

    <button class="home-tile" id="tilePedidos" type="button">
      <span class="home-tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
      </span>
      <span class="home-tile-label">Pedidos</span>
    </button>

    <button class="home-tile" id="tileRelatorio" type="button">
      <span class="home-tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/><path d="M2 20h20"/></svg>
      </span>
      <span class="home-tile-label">Relatório</span>
    </button>

    <button class="home-tile home-tile-locked" id="tileLocked" type="button" disabled aria-disabled="true" title="Em breve">
      <span class="home-tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      <span class="home-tile-label">Em breve</span>
    </button>
  </div>
</main>

<!-- CONFIG MODAL -->
<div class="modal-overlay" id="configModalOverlay">
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="configModalTitle">
    <div class="modal-header">
      <h2 id="configModalTitle">Configurações</h2>
      <button class="modal-close" id="configModalClose" aria-label="Fechar">&times;</button>
    </div>
    <div class="modal-body">
      <div class="settings-row">
        <div class="settings-row-text">
          <span class="settings-row-title">Modo escuro</span>
          <span class="settings-row-desc">Ativa um tema escuro em tons de cinza e chumbo, inspirado no YouTube.</span>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Alternar modo escuro">
          <span class="theme-toggle-thumb"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="home.js"></script>
</body>
</html>
